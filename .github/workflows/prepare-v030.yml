name: Prepare v0.3.0 metadata

on:
  push:
    branches:
      - automation/release-v0.3.0

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/release-v0.3.0
          fetch-depth: 0
      - name: Cut release metadata
        run: python3 tools/prepare_v030.py
      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/prepare-v030.yml tools/prepare_v030.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt README.md CHANGELOG.md AI_WORKSHEET.md
          git commit -m 'release: prepare CODEC v0.3.0 metadata'
          git push origin HEAD:automation/release-v0.3.0
