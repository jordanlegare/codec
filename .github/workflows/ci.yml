name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build curl ca-certificates libssl-dev libcurl4-openssl-dev libflac-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
      - name: Fetch pinned ONNX Runtime CPU
        env:
          ORT_VERSION: 1.29.0
          ORT_SHA256: c3fddc4f139a045b0c4902c57410f0694f1c2fdf9b6939fbe38b1aeae7cd14ba
        run: |
          archive="$RUNNER_TEMP/onnxruntime-linux-x64-$ORT_VERSION.tgz"
          root="$RUNNER_TEMP/onnxruntime-linux-x64-$ORT_VERSION"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-linux-x64-$ORT_VERSION.tgz"
          printf '%s  %s\n' "$ORT_SHA256" "$archive" | sha256sum --check --strict
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP"
          echo "CODEC_ONNXRUNTIME_ROOT=$root" >> "$GITHUB_ENV"
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Configure default build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCODEC_WARNINGS_AS_ERRORS=ON -DCODEC_ONNXRUNTIME_ROOT="$CODEC_ONNXRUNTIME_ROOT"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install package
        run: cmake --install build --prefix "$RUNNER_TEMP/codec-install"
      - name: Test installed package consumer
        run: |
          cmake -S tests/package_consumer -B package-consumer -G Ninja -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/codec-install"
          cmake --build package-consumer --parallel
          ./package-consumer/codec_package_consumer

  ffmpeg-disabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency-free video build requirements
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev libcurl4-openssl-dev libflac-dev
      - name: Configure without FFmpeg
        run: cmake -S . -B build-no-ffmpeg -G Ninja -DCMAKE_BUILD_TYPE=Release -DCODEC_WARNINGS_AS_ERRORS=ON -DCODEC_ENABLE_FFMPEG_VIDEO=OFF
      - name: Build
        run: cmake --build build-no-ffmpeg --parallel
      - name: Test
        run: ctest --test-dir build-no-ffmpeg --output-on-failure
      - name: Install package
        run: cmake --install build-no-ffmpeg --prefix "$RUNNER_TEMP/codec-install-no-ffmpeg"
      - name: Test installed package consumer
        run: |
          cmake -S tests/package_consumer -B package-consumer-no-ffmpeg -G Ninja -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/codec-install-no-ffmpeg"
          cmake --build package-consumer-no-ffmpeg --parallel
          ./package-consumer-no-ffmpeg/codec_package_consumer

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build curl ca-certificates libssl-dev libcurl4-openssl-dev libflac-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
      - name: Fetch pinned ONNX Runtime CPU
        env:
          ORT_VERSION: 1.29.0
          ORT_SHA256: c3fddc4f139a045b0c4902c57410f0694f1c2fdf9b6939fbe38b1aeae7cd14ba
        run: |
          archive="$RUNNER_TEMP/onnxruntime-linux-x64-$ORT_VERSION.tgz"
          root="$RUNNER_TEMP/onnxruntime-linux-x64-$ORT_VERSION"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-linux-x64-$ORT_VERSION.tgz"
          printf '%s  %s\n' "$ORT_SHA256" "$archive" | sha256sum --check --strict
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP"
          echo "CODEC_ONNXRUNTIME_ROOT=$root" >> "$GITHUB_ENV"
      - name: Configure default build with sanitizers
        run: cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCODEC_WARNINGS_AS_ERRORS=ON -DCODEC_ENABLE_SANITIZERS=ON -DCODEC_ONNXRUNTIME_ROOT="$CODEC_ONNXRUNTIME_ROOT"
      - name: Build
        run: cmake --build build-san --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure
